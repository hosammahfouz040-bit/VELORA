
name: VELORA - Test and Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "velora-github-source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test Flutter and Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e
          test -f velora-github-source.zip
          unzip -t velora-github-source.zip

      - name: Extract VELORA project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q velora-github-source.zip -d extracted

          test -f extracted/velora/pubspec.yaml
          test -f extracted/velora/pubspec.lock
          test -f extracted/velora/android/gradlew
          test -d extracted/velora/lib
          test -d extracted/velora/test

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: velora-android-ndk-r28c-v1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: extracted/velora/android/**/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Show tool versions
        shell: bash
        run: |
          flutter --version
          java -version
          df -h

      - name: Install Flutter dependencies
        working-directory: extracted/velora
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: extracted/velora
        run: flutter test

      -       - name: Build release APK
        id: build_apk
        continue-on-error: true
        working-directory: extracted/velora
        shell: bash
        run: |
          set -o pipefail
          echo "=== Flutter and Java versions ==="
          flutter --version
          java -version
          echo "=== Requested NDK version ==="
          grep -n 'ndkVersion' android/app/build.gradle.kts || true
          echo "=== Starting release build ==="
          timeout 20m flutter build apk --release --verbose 2>&1 \
            | tee "$GITHUB_WORKSPACE/velora-build.log"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VELORA-Build-Log
          path: velora-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VELORA-Android-APK
          path: extracted/velora/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Mark build failure
        if: steps.build_apk.outcome != 'success'
        shell: bash
        run: |
          echo "Release APK build failed."
          echo "Download VELORA-Build-Log from the Artifacts section."
          exit 1
