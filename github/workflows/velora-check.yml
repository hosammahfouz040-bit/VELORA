
name: VELORA Android Kotlin Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract VELORA source archive
        run: |
          mkdir -p source
          unzip -q VELORA_external_build_2026-10-27.zip -d source
          find source -name pubspec.yaml -print
          test -n "$(find source -name pubspec.yaml -print -quit)"

      - name: Locate Android project
        run: |
          ANDROID_DIR="$(dirname "$(find source -name gradlew -print -quit)")"
          if [ -z "$ANDROID_DIR" ] || [ ! -f "$ANDROID_DIR/gradlew" ]; then
            echo "Gradle wrapper not found in archive"
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Compile Kotlin
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --console=plain --stacktrace
