
name: VELORA - Test and Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "velora-github-source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test Flutter and Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          test -f velora-github-source.zip
          unzip -t velora-github-source.zip

      - name: Extract VELORA project
        run: |
          mkdir -p extracted
          unzip -q velora-github-source.zip -d extracted
          test -f extracted/velora/pubspec.yaml
          test -f extracted/velora/pubspec.lock
          test -f extracted/velora/android/gradlew
          test -d extracted/velora/lib
          test -d extracted/velora/test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install Flutter dependencies
        working-directory: extracted/velora
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: extracted/velora
        run: flutter test

      - name: Build release APK
        working-directory: extracted/velora
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VELORA-Android-APK
          path: extracted/velora/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
