
name: VELORA - Inspect Gradle Files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract VELORA ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t velora-github-source.zip
          mkdir -p extracted
          unzip -q velora-github-source.zip -d extracted
          test -f extracted/velora/pubspec.yaml
          echo "VELORA ZIP extracted successfully."

      - name: Print Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          find extracted/velora/android -type f \
            \( -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'gradle.properties' \
            -o -name 'gradle-wrapper.properties' \
            -o -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \) \
            -print -exec sh -c '
              echo
              echo "========== $1 =========="
              cat "$1"
            ' _ {} \;
      - name: Inspect Android native files
        shell: bash
        run: |
          echo "=== Android manifest ==="
          find extracted/velora/android/app/src -name AndroidManifest.xml -print
          find extracted/velora/android/app/src -name AndroidManifest.xml -exec cat {} \;
          echo "=== Native libraries and NDK settings ==="
          grep -RniE 'ndkVersion|abiFilters|jniLibs|pickFirst|useLegacyPackaging|externalNativeBuild' extracted/velora/android || true
          echo "=== Flutter dependencies ==="
          grep -nE 'media3|flutter|dependency_overrides' extracted/velora/pubspec.yaml || true
      - name: Set up Flutter for diagnostics
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Inspect Flutter and NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Flutter NDK configuration ==="
          grep -Rni 'ndkVersion' "$FLUTTER_ROOT/packages/flutter_tools/gradle" 2>/dev/null | head -30 || true
          echo "=== Installed Android NDK versions ==="
          ls -1 "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk" 2>/dev/null || true
          echo "=== Native libraries in project ==="
          find extracted/velora -type f -name '*.so' -print -exec du -h {} \;
          echo "=== Disk and memory ==="
          df -h
          free -h
